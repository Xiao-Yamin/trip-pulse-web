name: Generate README screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Capture mobile views
        run: |
          mkdir -p docs/screenshots
          python3 -m http.server 8765 >/tmp/trip-pulse-server.log 2>&1 &
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 430, height: 932 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true
            });
            await page.goto('http://127.0.0.1:8765/?testTime=2026-10-03T10:00&tz=KST', { waitUntil: 'networkidle' });
            await page.screenshot({ path: 'docs/screenshots/home.png' });
            await page.evaluate(() => switchView('all'));
            await page.waitForTimeout(250);
            await page.screenshot({ path: 'docs/screenshots/itinerary.png' });
            await page.evaluate(() => switchView('info'));
            await page.waitForTimeout(250);
            await page.screenshot({ path: 'docs/screenshots/expenses.png' });
            await browser.close();
          })();
          NODE
      - name: Commit screenshots
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/screenshots/*.png
          git commit -m "docs: add interface screenshots"
          git push
